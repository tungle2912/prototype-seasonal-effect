# pnpm 11 no longer reads settings from package.json's "pnpm" field or .npmrc
# (only auth/registry come from .npmrc). Dependency install scripts are opt-in.
#
# esbuild ships a platform-specific binary and needs its install script to run;
# without this pnpm refuses `pnpm exec` / `pnpm run` with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
